  <!-- 3. Variable -->
  <div class="card section-card section-card--variable hoverable">
    <div class="section-header section-header--variable">
      <div class="section-header__icon-wrap">
        <i class="material-icons" aria-hidden="true">trending_up</i>
      </div>
      <div class="section-header__text">
        <h2 class="section-header__title">Variable Expenses — Per Sq. Ft.</h2>
        <p class="section-header__meta">Sinking fund &amp; repair fund based on usable area</p>
      </div>
    </div>
    <div class="card-content">
      <div class="stat-highlight stat-highlight--variable" aria-live="polite">
        <div class="stat-highlight__icon-wrap">
          <i class="material-icons stat-highlight__icon" aria-hidden="true">square_foot</i>
        </div>
        <div class="stat-highlight__content center-align">
          <p class="stat-highlight__label">Construction Cost Per Sq. Ft.</p>
          <p class="stat-highlight__value"><span id="construction-rate">₹1,000</span></p>
        </div>
      </div>

      <div class="table-wrap">
        <table class="striped highlight cost-table">
          <thead class="green lighten-5">
            <tr>
              <th class="center-align col-num">#</th>
              <th>Particulars</th>
              <th class="right-align">Monthly</th>
              <th class="right-align">Annually</th>
            </tr>
          </thead>
          <tbody id="variable-items"></tbody>
        </table>
      </div>
      <div class="section-total section-total--variable">
        <div class="section-total__head">
          <div class="section-total__icon-wrap">
            <i class="material-icons" aria-hidden="true">currency_rupee</i>
          </div>
          <span class="section-total__label">Total Variable — Per Flat</span>
        </div>
        <div class="section-total__amounts">
          <div class="section-total__amount">
            <span class="section-total__period">Monthly</span>
            <strong id="variable-total-monthly">—</strong>
          </div>
          <div class="section-total__amount">
            <span class="section-total__period">Annually</span>
            <strong id="variable-total-annual">—</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
